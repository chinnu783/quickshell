[colors]
# Background and text colors
background={{colors.surface.default.hex}}
foreground={{colors.on_surface.default.hex}}

# Selection colors
selection-background={{colors.secondary_container.default.hex}}
selection-foreground={{colors.on_secondary_container.default.hex}}

# Cursor colors
cursor={{colors.primary.default.hex}} {{colors.on_primary.default.hex}}

# Normal colors (0-7)
regular0={{colors.surface_container_highest.default.hex}}
regular1={{colors.error.default.hex}}
regular2={{colors.primary.default.hex}}
regular3={{colors.tertiary.default.hex}}
regular4={{colors.secondary.default.hex}}
regular5={{colors.primary_container.default.hex}}
regular6={{colors.outline.default.hex}}
regular7={{colors.on_surface_variant.default.hex}}

# Bright colors (8-15)
bright0={{colors.outline_variant.default.hex}}
bright1={{colors.error.default.hex}}
bright2={{colors.primary.default.hex}}
bright3={{colors.tertiary.default.hex}}
bright4={{colors.secondary.default.hex}}
bright5={{colors.primary_container.default.hex}}
bright6={{colors.outline.default.hex}}
bright7={{colors.on_surface.default.hex}}
