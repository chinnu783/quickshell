[config]
terminals_as_dark=true
default_format = "hex"
reload_apps = true
[config.reload_apps_list]
gtk_theme = true

[templates.fabric]
input_path = "~/.config/matugen/templates/fabric.css"
output_path = "~/.cache/matugen/fabric/colors.css"
template_type = 'custom'

[templates.alacritty]
input_path = "~/.config/matugen/templates/alacritty.toml"
output_path = "~/.cache/matugen/alacritty/colors.toml"

# [templates.qs]
# input_path = "~/.config/matugen/templates/qs.qml"
# output_path = "~/.config/quickshell/Colors.qml"

[templates.quickshell]
input_path = '~/.config/matugen/templates/qs.json'
output_path = '~/.config/quickshell/colors.json'

[templates.gtk3]
input_path = "~/.config/matugen/templates/gtk.css"
output_path = "~/.config/gtk-3.0/colors.css"

[templates.gtk4]
input_path = "~/.config/matugen/templates/gtk.css"
output_path = "~/.config/gtk-4.0/colors.css"

[templates.gtktheme]
input_path = "~/.config/matugen/templates/gtk.css"
output_path = "~/.themes/adw-gtk3-dark-matugen/gtk-4.0/colors.css"

[templates.kvantum_kvconfig]
input_path = '~/.config/matugen/templates/kvantum-colors.kvconfig'
output_path = '~/.config/Kvantum/matugen/matugen.kvconfig'

[templates.kvantum_svg]
input_path = '~/.config/matugen/templates/kvantum-colors.svg'
output_path = '~/.config/Kvantum/matugen/matugen.svg'

[templates.ghostty]
input_path = '~/.config/matugen/templates/ghostty'
output_path = '~/.config/ghostty/themes/Matugen'
post_hook = 'pkill -SIGUSR2 ghostty'

[templates.zed]
input_path = '~/.config/matugen/templates/zed-colors.json'
output_path = '~/.config/zed/themes/matugen.json'

[templates.foot]
input_path = '~/.config/matugen/templates/foot.ini'
output_path = '~/.config/foot/colors.ini'
post_hook = 'chmod +x ~/.config/foot/foot-reload.sh && ~/.config/foot/foot-reload.sh'

[templates.kitty]
input_path = '~/.config/matugen/templates/kitty.conf'
output_path = '~/.config/kitty/themes/Matugen.conf'
post_hook = "kitty +kitten themes --reload-in=all Matugen"

[templates.btop]
input_path = '~/.config/matugen/templates/btop.theme'
output_path = '~/.config/btop/themes/matugen.theme'
post_hook = 'pkill -USR2 btop || true'

[templates.yazi]
input_path = '~/.config/matugen/templates/yazi.toml'
output_path = '~/.config/yazi/theme.toml'
