# Sourcing your wallpaper path and wallust color templates
source = ~/.config/wl/wl.conf
source = ~/.cache/wlust/hypr/hl.conf

general {
    hide_cursor = true
    grace = 0
    disable_loading_bar = true
}

background {
    monitor =
    path = $wallpaper 
    blur_passes = 3
    blur_size = 8
}

# LARGE TIME STACK
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H")"
    color = $foreground
    font_size = 120
    font_family = JetBrains Mono Nerd Font ExtraBold
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%M")"
    color = $color4
    font_size = 120
    font_family = JetBrains Mono Nerd Font ExtraBold
    position = 0, 10
    halign = center
    valign = center
}

# DATE STRING
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B")"
    color = $color5
    font_size = 14
    font_family = JetBrains Mono Nerd Font
    position = 0, -100
    halign = center
    valign = center
}

# PILL-SHAPED INPUT FIELD
input-field {
    monitor =
    size = 220, 45
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = $color4
    inner_color = $background
    font_color = $foreground
    fade_on_empty = false
    placeholder_text = <span>   Password</span>
    position = 0, -180
    halign = center
    valign = center
}
